name: pi-workbench
label: Pi Workbench
kind: platform
version: 0.1.0
manifest_version: 2
author: Pi Workbench
license: UNLICENSED
description: >
  The only path between Pi Workbench (local) and this Hermes profile.

  Acts as a single seam: device-token auth (one token per machine), per-device
  scopes (chat / dispatch / admin), rate limiting, audit, and a transparent
  reverse proxy to the local api_server so that runs, SSE streams, approvals,
  sessions and config keep working unchanged. The public dashboard is NOT
  proxied -- it keeps talking to Hermes directly.
requires_hermes: ">=0.22.6,<0.24"
python_dependencies: []
requires_env:
  - PI_HUB_ADMIN_KEY
optional_env:
  - name: HERMES_API_BASE
    description: "Local api_server base URL the hub proxies to (default http://127.0.0.1:8642)."
    prompt: "Hermes api_server base URL"
    password: false
  - name: PI_HUB_PORT
    description: "Hub listen port (default 8484, loopback only)."
    prompt: "Pi Workbench hub port"
    password: false
  - name: PI_HUB_HOST
    description: "Hub bind host (default 127.0.0.1; keep loopback and let Caddy terminate TLS)."
    prompt: "Pi Workbench hub bind host"
    password: false
  - name: PI_HUB_RATE_LIMIT
    description: "Requests per minute per device token (default 60)."
    prompt: "Hub rate limit (req/min/device)"
    password: false
