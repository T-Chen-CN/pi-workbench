appId: com.piworkbench.app
productName: Pi Workbench
directories:
  buildResources: build
  output: release
files:
  - dist
  - dist-electron
  - package.json
  - app-icon.png
win:
  target:
    - nsis
    - portable  # 添加便携版构建
  icon: app-icon.png
mac:
  target:
    - dmg
  icon: app-icon.png
linux:
  target:
    - AppImage
  icon: app-icon.png
nsis:
  # Per-user 安装，无需管理员权限
  perMachine: false
  # 允许用户选择安装路径
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 默认安装到用户目录（有写权限）
  # 默认路径会是 %LOCALAPPDATA%\Programs\Pi Workbench\
  installerIcon: app-icon.png
  uninstallerIcon: app-icon.png
  createDesktopShortcut: always
  createStartMenuShortcut: true
  # 安装时的说明
  license: LICENSE
portable:
  # 便携版配置
  # 用户可以解压到任意位置运行
  artifactName: ${productName}-${version}-portable.${ext}

