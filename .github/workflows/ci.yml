name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      # CI 只做编译与测试，不需要下载 Electron 二进制
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:i18n
      - run: npm run build:bridge
      - run: npm run type-check
      - run: npm run build:cloud
      - run: npm test
      - run: npm run lint
      - run: npm run build

  package-smoke:
    # Windows 全量测试 + 打包冒烟 + Playwright Electron 真实窗口冒烟（不发布、不签名）
    runs-on: windows-latest
    needs: verify
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --dir --publish never
      - name: Electron smoke E2E
        shell: bash
        env:
          PI_E2E_EXECUTABLE: release/win-unpacked/Pi Workbench.exe
        run: npm run test:e2e:smoke
