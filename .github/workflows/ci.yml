name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      # CI 只做编译与测试，不需要下载 Electron 二进制
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run lint
      - run: npm run build

  package-smoke:
    # 打包冒烟：确认 electron-builder 能产出未压缩的应用目录（不发布、不签名）
    runs-on: windows-latest
    needs: verify
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --dir --publish never
